include @CONF_DIR@/jaryan-security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' @MEDIA_ORIGIN@ data:; connect-src 'self' @MEDIA_ORIGIN@ @API_ORIGIN@; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
