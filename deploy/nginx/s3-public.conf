# Shared by /images/ and /catalog/ (media host). The object path is rebuilt from the normalised $uri, so the client's query
# string is not forwarded (a variable in proxy_pass drops it), and the bucket name never appears in a public URL.
if ($uri !~ "^/(images|catalog)/[A-Za-z0-9._~/-]+$") { return 404; }
set $s3_path /@BUCKET@$uri;
proxy_pass http://@S3_UPSTREAM@$s3_path;
proxy_http_version 1.1;
proxy_pass_request_headers off;               # no cookies, no Authorization, no x-amz-* from the client
proxy_set_header Host $proxy_host;
proxy_set_header Range $http_range;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header If-Modified-Since $http_if_modified_since;
proxy_set_header Connection "";
proxy_intercept_errors on;
error_page 400 401 403 404 405 500 501 502 503 504 =404 /__not_found;
proxy_hide_header Server;
proxy_hide_header X-Amz-Request-Id;
proxy_hide_header X-Amz-Id-2;
proxy_hide_header X-Amz-Version-Id;
proxy_hide_header X-Amz-Bucket-Region;
proxy_hide_header X-Minio-Deployment-Id;
proxy_hide_header X-Minio-Error-Code;
proxy_hide_header X-Minio-Error-Desc;
proxy_hide_header Set-Cookie;
add_header Access-Control-Allow-Origin "@SHOP_ORIGIN@" always;
add_header Vary "Origin" always;
include @CONF_DIR@/jaryan-security-headers.conf;
