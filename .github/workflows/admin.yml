# Builds the admin PWA (served by the API server at /admin/, never deployed to Cloudflare Pages) and runs its tests:
# unit tests, then browser end-to-end tests against the REAL server (embedded PostgreSQL, plus a real PostgreSQL 16 for the product workflow; local media, mandatory TOTP)
# with mobile-viewport and axe accessibility checks. Nothing is deployed and no secret is used.
name: Admin PWA

on:
  push:
    branches: [main]
    paths: ["admin/**", "scripts/admin/**", "server/**", "src/**", "public/**", "next.config.ts", "prisma/**", "vitest.e2e.config.mts", "package-lock.json", ".github/workflows/admin.yml"]
  pull_request:
    branches: [main]
    paths: ["admin/**", "scripts/admin/**", "server/**", "src/**", "public/**", "next.config.ts", "prisma/**", "vitest.e2e.config.mts", "package-lock.json", ".github/workflows/admin.yml"]

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A throw-away PostgreSQL 16 for the product-workflow browser test (CI-only credentials, nothing persists).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build the admin app
        run: npm run admin:build

      - name: Unit tests (admin libraries, admin UI server, architecture guards)
        run: npx vitest run admin/src server/admin-ui.test.ts server/first-run-setup.test.ts server/origin.test.ts server/embedded-concurrency.test.ts server/codespace-update.test.ts server/seo-fields.test.ts server/invariants.test.ts

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests (real server, TOTP login, RBAC, upload, CSV, axe, 390px)
        run: npx vitest run --config vitest.e2e.config.mts

      - name: Product workflow in the browser on real PostgreSQL 16 (first admin, category, image, publish, edit, variants; 412px phone)
        run: |
          npx prisma migrate deploy
          npx vitest run --config vitest.e2e.config.mts admin/e2e/product-workflow.e2e.ts
        env:
          DATABASE_URL: postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci
          E2E_DATABASE_URL: postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci

      # Publishing pipeline: the real admin UI publishes, a real static storefront build (made once, before anything is
      # published) shows it to a customer's browser; no rebuild. Needs its own EMPTY database (first-run setup).
      - name: Storefront publishing pipeline on real PostgreSQL 16 (publish, edit, unpublish, archive; no redeploy)
        run: |
          PGPASSWORD=ci-only-throwaway psql -h 127.0.0.1 -U ci -d ci -c "create database ci_storefront"
          DATABASE_URL=postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci_storefront npx prisma migrate deploy
          npx vitest run --config vitest.e2e.config.mts admin/e2e/storefront-publish.e2e.ts
        env:
          E2E_DATABASE_URL: postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci_storefront

      # The shopper's journey: cart, checkout with an SMS code (development console provider), a real pending order on PostgreSQL,
      # confirmation, history, the owner's read-only orders page, and a build without an order system (demo checkout).
      - name: Shopping journey on real PostgreSQL 16 (cart, checkout, orders; 412px phone)
        run: |
          PGPASSWORD=ci-only-throwaway psql -h 127.0.0.1 -U ci -d ci -c "create database ci_shopping"
          DATABASE_URL=postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci_shopping npx prisma migrate deploy
          npx vitest run --config vitest.e2e.config.mts admin/e2e/shopping.e2e.ts
        env:
          E2E_DATABASE_URL: postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci_shopping

      # Order management and inventory safety: two real browsers race for one unique piece, owner confirms/cancels/rejects, stock
      # comes back once, the "new orders" indicator, and a check that no page ever contacts a foreign host.
      - name: Order management on real PostgreSQL 16 (reservations, races, confirm/reject/cancel; 412px phone)
        run: |
          PGPASSWORD=ci-only-throwaway psql -h 127.0.0.1 -U ci -d ci -c "create database ci_orders"
          DATABASE_URL=postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci_orders npx prisma migrate deploy
          npx vitest run --config vitest.e2e.config.mts admin/e2e/order-management.e2e.ts
        env:
          E2E_DATABASE_URL: postgresql://ci:ci-only-throwaway@127.0.0.1:5432/ci_orders
