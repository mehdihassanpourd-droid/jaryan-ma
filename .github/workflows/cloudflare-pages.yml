# Quality checks + build on every PR and push to main, then deploy the static export
# (`out/`) to the Cloudflare Pages project "jaryan-ma":
#   - push to main        -> production deployment
#   - pull request        -> preview deployment (alias: pr-<number>.jaryan-ma.pages.dev)
#
# A deployment is only reported as successful after the LIVE site is fetched and found to serve this exact commit
# (scripts/deploy/verify-live.sh); a production deployment also waits for every other check on the commit (scripts/deploy/wait-for-checks.sh).
#
# Deployment needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until both exist the deploy job skips itself; checks and build still run.
# See README.md "Automated deployment (GitHub Actions)".
name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Used by the "SEO monitor" workflow to rebuild the site after the published catalogue changed (so new products get pages and the sitemap
  # stays current). Only ever from main: see the `if` of the build job. It does nothing unless that workflow's opt-in variable is set.
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  # Never cancel an in-flight production deploy; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    # A manual/automated run builds and deploys production, so it is only allowed from main.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint + typecheck + unit tests + prisma schema validation
      - name: Quality checks
        run: npm run check

      # Optional, public value (metadata only). Set it as a repository *variable*, not a secret.
      - name: Configure public site URL
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          fi

      # Optional, public value: the base URL of the public catalogue snapshots (https). With it the storefront shows the
      # REAL published products, read live in the visitor's browser, so publishing in the admin needs no new deployment.
      # Without it the site keeps its labelled sample content. Set it as a repository *variable*, never a secret.
      - name: Configure live catalogue URL
        env:
          CATALOG_URL: ${{ vars.NEXT_PUBLIC_CATALOG_URL }}
        run: |
          if [ -n "$CATALOG_URL" ]; then
            echo "NEXT_PUBLIC_CATALOG_URL=$CATALOG_URL" >> "$GITHUB_ENV"
          fi

      # Optional, public value: the base URL of the customer API. With it checkout places real PENDING orders (after an SMS-code
      # sign-in); without it the checkout is a labelled demo that creates nothing. Never a secret: set it as a repository *variable*.
      - name: Configure order system URL
        env:
          ORDER_API_URL: ${{ vars.NEXT_PUBLIC_ORDER_API_URL }}
        run: |
          if [ -n "$ORDER_API_URL" ]; then
            echo "NEXT_PUBLIC_ORDER_API_URL=$ORDER_API_URL" >> "$GITHUB_ENV"
          fi

      # Optional, public values for SEO (see docs/seo/SEO.md): the catalogue the pages are generated from at build time, and the launch switch.
      # Both come from repository *variables*; when unset nothing changes (the site keeps its closed, sample-content behaviour).
      - name: Configure SEO catalogue and launch switch
        env:
          SNAPSHOT_URL: ${{ vars.CATALOG_SNAPSHOT_URL }}
          ALLOW_INDEXING: ${{ vars.SEO_ALLOW_INDEXING }}
        run: |
          if [ -n "$SNAPSHOT_URL" ]; then
            echo "CATALOG_SNAPSHOT_URL=$SNAPSHOT_URL" >> "$GITHUB_ENV"
          fi
          if [ -n "$ALLOW_INDEXING" ]; then
            echo "SEO_ALLOW_INDEXING=$ALLOW_INDEXING" >> "$GITHUB_ENV"
          fi

      - name: Build static export
        run: npm run build

      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/_headers

      # Public, harmless: which commit this build is. The deploy job fetches it back from the live URL to prove the deployment is really served.
      - name: Record build info
        env:
          COMMIT: ${{ github.sha }}
        run: printf '{"commit":"%s"}\n' "$COMMIT" > out/build-info.json

      - name: Upload static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-out
          path: out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `checks: read` lets the production gate see the other checks of the commit; nothing here can write to the repository.
    permissions:
      contents: read
      checks: read
    # Forked PRs cannot read secrets (and must not be deployed from this workflow).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Only the two small deployment scripts are needed here (the site itself comes from the build artifact).
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/deploy
          persist-credentials: false

      # Secrets are only inspected for presence; their values are never printed.
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
          fi

      - name: Download static site
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-out
          path: out

      # Production only goes live after EVERY other check on this commit (browser tests, PostgreSQL 16 tests, SEO output, ...) is green. A failed
      # check holds it back and the "Deployment watch" workflow opens an issue; fix it, then re-run this job. Previews are gated by `build` above.
      - name: Wait for the other checks on this commit
        if: steps.creds.outputs.enabled == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: bash scripts/deploy/wait-for-checks.sh "$REPO" "$COMMIT" 2400 'Check and build|Deploy to Cloudflare Pages|Report deployment result'

      # Branch is a fixed value or the PR number, never user-controlled text.
      # "main" is the project's production branch, so it becomes the production deployment.
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=jaryan-ma --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }} --commit-hash=${{ github.sha }}

      # Trust the result, not the configuration: fetch the live site and require it to serve THIS commit (and its pages to answer).
      # Production is checked at the permanent address; a preview at its own deployment address (and its PR alias).
      - name: Verify the live site serves this commit
        id: verify
        if: steps.creds.outputs.enabled == 'true'
        env:
          COMMIT: ${{ github.sha }}
          IS_PREVIEW: ${{ github.event_name == 'pull_request' }}
          PERMANENT_URL: ${{ vars.PREVIEW_URL || 'https://jaryan-ma.pages.dev' }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            bash scripts/deploy/verify-live.sh "$DEPLOY_URL" "$COMMIT" 300
            if [ -n "$ALIAS_URL" ]; then bash scripts/deploy/verify-live.sh "$ALIAS_URL" "$COMMIT" 300; fi
          else
            bash scripts/deploy/verify-live.sh "$PERMANENT_URL" "$COMMIT" 300
          fi

      - name: Summary
        if: steps.creds.outputs.enabled == 'true'
        env:
          PERMANENT_URL: ${{ vars.PREVIEW_URL || 'https://jaryan-ma.pages.dev' }}
          COMMIT: ${{ github.sha }}
          KIND: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### $KIND deployment"
            echo "- Deployment: $DEPLOY_URL"
            if [ -n "$ALIAS_URL" ]; then echo "- Alias: $ALIAS_URL"; fi
            if [ "$KIND" = "Production" ]; then echo "- Permanent address: $PERMANENT_URL (verified: serves commit ${COMMIT:0:12})"; fi
          } >> "$GITHUB_STEP_SUMMARY"
