# Quality checks + build on every PR and push to main, then deploy the static export
# (`out/`) to the Cloudflare Pages project "jaryan-ma":
#   - push to main        -> production deployment
#   - pull request        -> preview deployment (alias: pr-<number>.jaryan-ma.pages.dev)
#
# Deployment needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until both exist the deploy job skips itself; checks and build still run.
# See README.md "Automated deployment (GitHub Actions)".
name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  # Never cancel an in-flight production deploy; superseded PR runs can be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # lint + typecheck + unit tests + prisma schema validation
      - name: Quality checks
        run: npm run check

      # Optional, public value (metadata only). Set it as a repository *variable*, not a secret.
      - name: Configure public site URL
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          if [ -n "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          fi

      - name: Build static export
        run: npm run build

      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/_headers

      - name: Upload static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-out
          path: out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forked PRs cannot read secrets (and must not be deployed from this workflow).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Secrets are only inspected for presence; their values are never printed.
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
          fi

      - name: Download static site
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-out
          path: out

      # Branch is a fixed value or the PR number, never user-controlled text.
      # "main" is the project's production branch, so it becomes the production deployment.
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=jaryan-ma --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }} --commit-hash=${{ github.sha }}

      - name: Summary
        if: steps.creds.outputs.enabled == 'true'
        env:
          KIND: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### $KIND deployment"
            echo "- Deployment: $DEPLOY_URL"
            if [ -n "$ALIAS_URL" ]; then echo "- Alias: $ALIAS_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
