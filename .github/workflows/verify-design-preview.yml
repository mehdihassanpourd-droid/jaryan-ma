# TEMPORARY, read-only: fetches the live PR #23 preview from a GitHub runner and prints exactly what the browser receives
# (viewport tag, headers, CSS breakpoints, deployed commit). No secrets, no third-party actions. Delete this branch afterwards.
name: Verify design preview (temporary)

on:
  push:
    branches: [claude/verify-design-preview]

permissions:
  contents: read

jobs:
  verify:
    name: Fetch the live preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch
        run: |
          base="https://pr-23.jaryan-ma.pages.dev"
          for ua in "Mozilla/5.0 (Linux; Android 14; SM-S911B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"; do
            echo "=================== UA: $ua"
            curl -sS -L --max-time 30 -A "$ua" -D /tmp/h -o /tmp/b "$base/" -w 'HTTP %{http_code}, %{size_download} bytes\n'
            echo "--- response headers"; tr -d '\r' < /tmp/h
            echo "--- viewport / theme-color / charset / lang+dir"
            grep -o '<meta name="viewport"[^>]*>' /tmp/b || echo "NO VIEWPORT META"
            grep -o '<meta name="theme-color"[^>]*>' /tmp/b || true
            grep -o '<meta charSet="[^"]*"' /tmp/b || grep -o '<meta charset="[^"]*"' /tmp/b || true
            grep -o '<html[^>]*>' /tmp/b
            echo "--- first 600 bytes of the page"; head -c 600 /tmp/b; echo
            echo "--- sha256 of the HTML"; sha256sum /tmp/b
          done
          echo "=================== CSS actually served"
          for css in $(grep -o '/_next/static/[^"]*\.css' /tmp/b | sort -u); do
            curl -sS -L --max-time 30 -o /tmp/c "$base$css" -w "%{http_code} ${css} %{size_download}B\n"
            printf 'min-width:48rem rules: '; grep -o '@media (min-width:48rem)' /tmp/c | wc -l
            printf 'min-width:40rem rules: '; grep -o '@media (min-width:40rem)' /tmp/c | wc -l
            printf 'md:hidden / max-md hidden present: '; grep -c 'md\\:hidden\|max-md' /tmp/c || true
          done
          echo "=================== Deployed commit"
          curl -sS -L --max-time 30 "$base/build-info.json" || echo "no build-info.json"; echo
