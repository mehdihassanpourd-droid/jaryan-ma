# Independent clean-up of the connectivity-probe trial. It does not depend on the run that created anything: every 3 hours it
# lists the resources named jm-probe-*, deletes those past their expiry (the expiry is written into the name), retries, lists
# again, and if anything cannot be confirmed gone it opens or updates a GitHub issue so the owner is notified.
# Without the ARVAN_API_KEY secret it does nothing and succeeds. GitHub may delay or skip scheduled runs, and disables them
# after 60 days without repository activity in a public repository; this is a safety net, not a guarantee.
name: Probe cleanup

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "ArvanCloud region code"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: probe-cleanup
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep expired probe resources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARVAN_API_KEY: ${{ secrets.ARVAN_API_KEY }}
      PROBE_ACTION: sweep
      PROBE_REGION: ${{ inputs.region }}
      PROBE_OUT_DIR: probe-out
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Sweep
        id: sweep
        run: node ops/connectivity-probe/automation/cli.mjs

      # One issue, not one comment every 3 hours: a new comment is added only when the last activity is more than 20 hours old.
      - name: Tell the owner when the clean-up could not be confirmed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="هشدار: پاکسازی سرور آزمایشی تأیید نشد"
          body="پاکسازی خودکار نتوانست تأیید کند که همهٔ منابع آزمایشی (نام‌هایی که با jm-probe- شروع می‌شوند) حذف شده‌اند. ممکن است هزینه ادامه پیدا کند. لطفاً در پنل ابر آروان هر سرور، دیسک یا اسنپ‌شات با این پیشوند را حذف کنید. جزئیات: $RUN_URL"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            updated=$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json updatedAt --jq .updatedAt)
            age=$(( $(date +%s) - $(date -d "$updated" +%s) ))
            if [ "$age" -gt 72000 ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"; fi
          fi

      # A confirmed-clean sweep closes the open alert, so the alert never stays up after the cause is gone.
      - name: Close the alert once a sweep is confirmed clean
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="هشدار: پاکسازی سرور آزمایشی تأیید نشد"
          # a run that was skipped (no secret) confirmed nothing, so it must not close the alert
          if grep -q '"skipped"' probe-out/report.json; then exit 0; fi
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "پاکسازی خودکار دوباره تأیید کرد که منبعی با پیشوند jm-probe- باقی نمانده است ($RUN_URL). این هشدار بسته شد."
          fi

      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-sweep-report
          path: probe-out
          retention-days: 7
          if-no-files-found: ignore
